<style>
:root {
  /* DARK theme (default) */
  --night: #080810;
  --panel: #12121a;
  --panel-2: #1a1a26;
  --gold: #d4af37;
  --gold-deep: #a68628;
  --gold-glow: rgba(212, 175, 55, 0.18);
  --crimson: #dc2626;
  --crimson-glow: rgba(220, 38, 38, 0.35);
  --ivory: #f8f0e3;
  --silver: #6b7280;
  --divider: #2a2a35;
  --space-bg: radial-gradient(ellipse at center, #0a0a18 0%, #050509 60%, #000 100%);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* LIGHT theme override */
:root[data-theme="light"] {
  --night: #f5efe2;
  --panel: #ffffff;
  --panel-2: #f0e8d4;
  --gold: #8b6914;
  --gold-deep: #5e470d;
  --gold-glow: rgba(139, 105, 20, 0.22);
  --crimson: #b91c1c;
  --crimson-glow: rgba(185, 28, 28, 0.35);
  --ivory: #1a1a26;
  --silver: #6b7280;
  --divider: #d4c8a8;
  --space-bg: radial-gradient(ellipse at center, #cfe8f5 0%, #aac8e0 60%, #7da6c5 100%);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'Josefin Sans', system-ui, sans-serif;
  background: var(--night);
  color: var(--ivory);
  font-weight: 400;
  letter-spacing: 0.02em;
  user-select: none;
  -webkit-user-select: none;
}

#map { position: fixed; inset: 0; background: var(--night); }

/* Leaflet dark tweaks */
.leaflet-container { background: #050509 !important; outline: none; font-family: inherit; }
.leaflet-control-attribution {
  background: rgba(8, 8, 16, 0.7) !important;
  color: var(--silver) !important;
  font-size: 9px !important;
  border: 1px solid var(--divider);
  padding: 2px 6px !important;
}
.leaflet-control-attribution a { color: var(--gold-deep) !important; }
.leaflet-control-zoom { border: 1px solid var(--divider) !important; box-shadow: none !important; }
.leaflet-control-zoom a {
  background: var(--panel) !important;
  color: var(--gold) !important;
  border-bottom: 1px solid var(--divider) !important;
  font-family: 'Cinzel', serif !important;
  font-weight: 600;
}
.leaflet-control-zoom a:hover { background: var(--panel-2) !important; }

/* Station markers — większe (18px) + 44px tap target dla mobile */
.station-marker-wrap {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  cursor: pointer;
  position: relative;
}
.station-marker {
  width: 18px; height: 18px;
  background: var(--gold);
  border: 2px solid var(--night);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--gold-glow), 0 0 0 1.5px rgba(212,175,55,0.45);
  transition: transform 0.15s ease;
  pointer-events: none;
}
.station-marker-wrap:hover .station-marker { transform: scale(1.35); }

.station-marker.active {
  background: var(--crimson);
  border-color: var(--ivory);
  box-shadow: 0 0 0 0 var(--crimson-glow);
  animation: pulse 1.6s ease-out infinite;
  width: 22px; height: 22px;
  z-index: 1000;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(220,38,38,0.6); }
  70%  { box-shadow: 0 0 0 18px rgba(220,38,38,0); }
  100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
}

/* Cluster styling */
.marker-cluster {
  background: rgba(212, 175, 55, 0.18) !important;
  border: 1px solid var(--gold) !important;
}
.marker-cluster div {
  background: var(--gold) !important;
  color: var(--night) !important;
  font-family: 'Cinzel', serif !important;
  font-weight: 600 !important;
  font-size: 11px !important;
  border: none !important;
}

/* ============== GLOBE (3D orthographic) ============== */
#globeContainer {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: none; /* toggled by JS */
  background: var(--space-bg);
  cursor: grab;
  touch-action: none;
}
#globeContainer.visible { display: block; }
#globeContainer:active { cursor: grabbing; }
#globeStars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.3s;
}
:root[data-theme="light"] #globeStars { opacity: 0; }
#globeSvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.globe-sphere {
  fill: url(#globeOcean);
  stroke: var(--gold);
  stroke-width: 0.6;
  stroke-opacity: 0.5;
}
.globe-graticule {
  fill: none;
  stroke: var(--gold);
  stroke-width: 0.3;
  stroke-opacity: 0.18;
}
.globe-land {
  fill: var(--panel-2);
  stroke: var(--gold);
  stroke-width: 0.5;
  stroke-opacity: 0.6;
}
:root[data-theme="light"] .globe-land {
  fill: #e8d8a8;
}
.globe-marker {
  fill: var(--gold);
  stroke: var(--night);
  stroke-width: 1.2;
  cursor: pointer;
  transition: r 0.15s, fill 0.15s;
  pointer-events: auto;
}
.globe-marker-hit {
  fill: rgba(0,0,0,0);
  stroke: none;
  cursor: pointer;
  pointer-events: auto;
}
.globe-marker:hover { r: 8; }
.globe-marker.active {
  fill: var(--crimson);
  stroke: var(--ivory);
  r: 8;
}
/* Wszystkie inne SVG elementy globusa nie powinny przechwytywać kliknięć */
.globe-sphere, .globe-graticule, .globe-land, .globe-night, .globe-night-edge {
  pointer-events: none;
}
.globe-night {
  fill: rgba(0, 0, 20, 0.55);
  pointer-events: none;
}
:root[data-theme="light"] .globe-night {
  fill: rgba(40, 30, 80, 0.30);
}
.globe-night-edge {
  fill: none;
  stroke: var(--gold);
  stroke-width: 0.8;
  stroke-opacity: 0.35;
  stroke-dasharray: 3 3;
  pointer-events: none;
}
.globe-sun {
  fill: #ffd966;
  stroke: #ff9900;
  stroke-width: 1.5;
  filter: drop-shadow(0 0 8px rgba(255, 200, 80, 0.9));
  pointer-events: none;
}
.globe-sun-rays {
  stroke: #ffd966;
  stroke-width: 1.2;
  stroke-opacity: 0.6;
  pointer-events: none;
}
.globe-moon {
  fill: #e8e8f0;
  stroke: #b0b0c0;
  stroke-width: 1;
  filter: drop-shadow(0 0 4px rgba(220, 220, 240, 0.7));
  pointer-events: none;
}
.globe-moon-shadow {
  fill: rgba(20, 20, 35, 0.85);
  pointer-events: none;
}

/* ============== COSMOS MODE ============== */
/* Active dot na przycisku kosmosu */
#cosmosBtn.active::after {
  content: '';
  position: absolute;
  top: 6px; right: 6px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 6px var(--gold);
}
.icon-btn { position: relative; }

/* Tory orbit (eliptyczne ścieżki) */
.cosmos-orbit {
  fill: none;
  stroke: var(--gold);
  stroke-opacity: 0.18;
  stroke-width: 0.5;
  stroke-dasharray: 2 4;
  pointer-events: none;
}
.cosmos-orbit.moon-orbit {
  stroke-opacity: 0.28;
  stroke-width: 0.8;
  stroke-dasharray: 4 4;
  stroke: #c0c0d0;
}

/* ISS - jasny, większy niż satelity */
.cosmos-iss {
  fill: #4ade80;
  stroke: #ffffff;
  stroke-width: 1.2;
  filter: drop-shadow(0 0 5px rgba(74, 222, 128, 0.8));
  pointer-events: auto;
  cursor: pointer;
}
.cosmos-iss-trail {
  fill: none;
  stroke: #4ade80;
  stroke-width: 1.5;
  stroke-opacity: 0.55;
  stroke-linecap: round;
  pointer-events: none;
}

/* Satelity - małe, srebrne, lekko świecące */
.cosmos-sat {
  fill: #cbd5e1;
  stroke: #94a3b8;
  stroke-width: 0.5;
  pointer-events: auto;
  cursor: pointer;
}
.cosmos-sat-starlink { fill: #60a5fa; stroke: #1e40af; }
.cosmos-sat-gps { fill: #fbbf24; stroke: #92400e; }
.cosmos-sat-geo { fill: #f472b6; stroke: #831843; }

/* Śmieci - emoji rotujące */
.cosmos-debris {
  pointer-events: auto;
  cursor: pointer;
  user-select: none;
  font-size: 14px;
  text-anchor: middle;
  dominant-baseline: middle;
}

/* Komety - szybkie obiekty z warkoczem przelatujące przez tło */
.cosmos-comet-head {
  fill: #fef3c7;
  stroke: #fbbf24;
  stroke-width: 1;
  filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.9));
  pointer-events: none;
}
.cosmos-comet-tail {
  fill: none;
  stroke: url(#cometTailGradient);
  stroke-width: 5;
  stroke-linecap: round;
  pointer-events: none;
  opacity: 0.85;
}

/* Tooltip-style label dla satelitów */
.cosmos-label {
  fill: var(--ivory);
  font-size: 9px;
  font-family: 'JetBrains Mono', monospace;
  pointer-events: none;
  paint-order: stroke;
  stroke: var(--night);
  stroke-width: 3;
  stroke-linejoin: round;
}

/* Cosmos panel options */
.cosmos-options {
  padding: 12px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}
.cosmos-section {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-deep);
  padding: 12px 0 4px;
  border-bottom: 1px solid var(--divider);
  margin-bottom: 4px;
}
.cosmos-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--panel-2);
  border: 1px solid var(--divider);
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  user-select: none;
}
.cosmos-toggle:hover {
  background: var(--panel);
  border-color: var(--gold-deep);
}
.cosmos-toggle input[type="checkbox"] {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid var(--gold-deep);
  border-radius: 3px;
  background: var(--night);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
}
.cosmos-toggle input[type="checkbox"]:checked {
  background: var(--gold);
  border-color: var(--gold);
}
.cosmos-toggle input[type="checkbox"]:checked::after {
  content: '✓';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: var(--night);
  font-weight: bold;
  font-size: 14px;
  line-height: 1;
}
.ct-text {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--ivory);
}
.ct-emoji {
  font-size: 18px;
  width: 22px;
  text-align: center;
}
.cosmos-info {
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--panel-2);
  border-left: 2px solid var(--gold);
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--silver);
  line-height: 1.5;
}
.cosmos-info strong { color: var(--gold); font-weight: 400; }

/* ============== Recently Played panel ============== */
.recent-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--divider);
  cursor: pointer;
  transition: background 0.15s;
}
.recent-row:hover { background: var(--panel-2); }
.recent-row .rr-favicon {
  width: 32px; height: 32px;
  border-radius: 2px;
  background: var(--panel-2);
  border: 1px solid var(--divider);
  display: grid; place-items: center;
  flex-shrink: 0;
  overflow: hidden;
  color: var(--gold);
}
.recent-row .rr-favicon img { width: 100%; height: 100%; object-fit: cover; }
.recent-row .rr-favicon svg { width: 16px; height: 16px; }
.recent-row .rr-info { flex: 1; min-width: 0; }
.recent-row .rr-name {
  font-weight: 500; font-size: 13px; color: var(--ivory);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.recent-row .rr-meta {
  font-size: 10px; color: var(--silver); margin-top: 2px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.recent-empty {
  padding: 24px; text-align: center; color: var(--silver);
  font-size: 12px; font-style: italic;
}

/* ============== Genre chips ============== */
.genre-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 12px;
  scrollbar-width: none;
  border-bottom: 1px solid var(--divider);
}
.genre-bar::-webkit-scrollbar { display: none; }
.genre-chip {
  flex-shrink: 0;
  background: var(--panel-2);
  border: 1px solid var(--divider);
  color: var(--ivory);
  padding: 6px 12px;
  border-radius: 14px;
  font-size: 11px;
  font-family: 'Cinzel', serif;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.genre-chip:hover { border-color: var(--gold); }
.genre-chip.active {
  background: var(--gold);
  color: var(--night);
  border-color: var(--gold);
}

/* Top bar */
.topbar {
  position: fixed;
  top: calc(var(--safe-top) + 12px);
  left: 12px; right: 12px;
  z-index: 500;
  display: flex;
  gap: 8px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }

.brand {
  background: rgba(8, 8, 16, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--gold);
  padding: 8px 14px;
  border-radius: 2px;
  font-family: 'Cinzel', serif;
  font-weight: 600;
  letter-spacing: 0.18em;
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.brand::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--crimson); box-shadow: 0 0 8px var(--crimson);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot { 50% { opacity: 0.4; } }

.icon-btn {
  background: rgba(8, 8, 16, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--divider);
  width: 40px; height: 40px;
  border-radius: 2px;
  color: var(--ivory);
  display: grid; place-items: center;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.icon-btn:hover, .icon-btn.active { border-color: var(--gold); color: var(--gold); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--crimson); color: var(--ivory);
  border-radius: 50%; width: 16px; height: 16px;
  font-size: 9px; display: grid; place-items: center;
  font-weight: 600;
}

.spacer { flex: 1; }

/* Search panel */
.panel {
  position: fixed;
  top: calc(var(--safe-top) + 64px);
  left: 12px; right: 12px;
  z-index: 600;
  background: rgba(18, 18, 26, 0.97);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--divider);
  border-radius: 4px;
  max-height: calc(100vh - 220px - var(--safe-top) - var(--safe-bottom));
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.panel.open { display: flex; animation: slide-down 0.25s ease; }
@keyframes slide-down { from { transform: translateY(-12px); opacity: 0; } }

.panel-header {
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--divider);
}
.panel-title {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 600;
}

.search-input {
  background: transparent;
  border: none;
  color: var(--ivory);
  font-family: inherit;
  font-size: 14px;
  flex: 1;
  outline: none;
  padding: 4px 0;
}
.search-input::placeholder { color: var(--silver); }

.station-list { overflow-y: auto; max-height: 60vh; }
.station-row {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(42, 42, 53, 0.5);
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  transition: background 0.15s;
}
.station-row:hover { background: rgba(212, 175, 55, 0.06); }
.station-row:last-child { border-bottom: none; }
.station-row.active { background: rgba(220, 38, 38, 0.08); border-left: 2px solid var(--crimson); }

.station-favicon {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--night);
  display: grid; place-items: center;
  flex-shrink: 0;
  overflow: hidden;
}
.station-favicon img { width: 100%; height: 100%; object-fit: cover; }
.station-favicon svg { width: 18px; height: 18px; color: var(--gold); }

.station-meta { flex: 1; min-width: 0; }
.station-name {
  font-size: 13px; font-weight: 500;
  color: var(--ivory);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.station-info {
  font-size: 11px;
  color: var(--silver);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.station-fav-btn {
  background: none; border: none;
  color: var(--silver);
  cursor: pointer;
  padding: 6px;
}
.station-fav-btn.active { color: var(--crimson); }

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--silver);
  font-size: 12px;
}
.empty-state .deco {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold-deep);
  margin-bottom: 12px;
}

/* Player */
.player {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 700;
  background: linear-gradient(180deg, rgba(18, 18, 26, 0.95) 0%, rgba(8, 8, 16, 1) 100%);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--gold-deep);
  padding: 12px 14px calc(12px + var(--safe-bottom)) 14px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.player.visible { transform: translateY(0); }
.player.expanded { padding-top: 24px; }

.player-row {
  display: flex; align-items: center; gap: 12px;
}
.player-favicon {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--night);
  border: 1px solid var(--divider);
  display: grid; place-items: center;
  flex-shrink: 0;
  overflow: hidden;
}
.player-favicon img { width: 100%; height: 100%; object-fit: cover; }
.player-favicon svg { width: 24px; height: 24px; color: var(--gold); }

.player-meta { flex: 1; min-width: 0; }
.player-name {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ivory);
  letter-spacing: 0.04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-info {
  font-size: 10px;
  color: var(--silver);
  margin-top: 2px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Equalizer */
.eq {
  display: flex; gap: 2px; align-items: flex-end;
  width: 16px; height: 16px;
}
.eq span {
  flex: 1; background: var(--gold);
  height: 30%;
  transition: height 0.2s;
}
.eq.playing span { animation: eq-bounce 0.8s ease-in-out infinite; background: var(--crimson); }
.eq.playing span:nth-child(1) { animation-delay: 0s; }
.eq.playing span:nth-child(2) { animation-delay: 0.15s; }
.eq.playing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes eq-bounce {
  0%, 100% { height: 30%; }
  50% { height: 95%; }
}

.player-btn {
  background: var(--gold);
  border: none;
  color: var(--night);
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s;
}
.player-btn:active { transform: scale(0.92); }
.player-btn svg { width: 22px; height: 22px; }
.player-btn.loading svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.player-mini-btn {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--silver);
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.player-mini-btn:hover { border-color: var(--gold); color: var(--gold); }
.player-mini-btn.active { color: var(--crimson); border-color: var(--crimson); }
.player-mini-btn svg { width: 16px; height: 16px; }

/* Loading overlay */
.loading {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--night);
  display: grid; place-items: center;
  flex-direction: column;
  transition: opacity 0.4s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-content { text-align: center; }
.loading-deco {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--gold-deep);
  margin-bottom: 16px;
  text-transform: uppercase;
}
.loading-title {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--gold);
  margin-bottom: 24px;
  text-transform: uppercase;
}
.loading-spinner {
  width: 40px; height: 40px;
  border: 1.5px solid var(--divider);
  border-top-color: var(--gold);
  border-radius: 50%;
  margin: 0 auto;
  animation: spin 0.8s linear infinite;
}
.loading-status {
  margin-top: 16px;
  font-size: 11px;
  color: var(--silver);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(120px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--panel);
  border: 1px solid var(--gold);
  padding: 10px 18px;
  border-radius: 2px;
  font-size: 12px;
  color: var(--ivory);
  z-index: 9000;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Filters bar */
.filters {
  display: flex; gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--divider);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.filter-chip {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--silver);
  padding: 5px 12px;
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  border-radius: 2px;
  transition: all 0.2s;
}
.filter-chip.active { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.08); }

/* Decorative corners (Art Deco touch) */
.corner-deco {
  position: fixed;
  width: 30px; height: 30px;
  pointer-events: none;
  z-index: 100;
  opacity: 0.4;
}
.corner-deco::before, .corner-deco::after {
  content: '';
  position: absolute;
  background: var(--gold);
}
.corner-tl { top: calc(var(--safe-top) + 4px); left: 4px; }
.corner-tl::before { top: 0; left: 0; width: 12px; height: 1px; }
.corner-tl::after { top: 0; left: 0; width: 1px; height: 12px; }
.corner-tr { top: calc(var(--safe-top) + 4px); right: 4px; }
.corner-tr::before { top: 0; right: 0; width: 12px; height: 1px; }
.corner-tr::after { top: 0; right: 0; width: 1px; height: 12px; }

@media (max-width: 380px) {
  .brand { font-size: 10px; padding: 7px 10px; letter-spacing: 0.12em; }
  .icon-btn { width: 36px; height: 36px; }
}
</style>

<!-- Leaflet + clustering: robust loader with CDN fallback (jsDelivr -> unpkg -> cdnjs) -->
<script>
(function(){
  function loadScript(urls, cb){
    var i = 0;
    function tryNext(){
      if (i >= urls.length) { cb(new Error('All CDNs failed for ' + urls[0])); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.crossOrigin = '';
      s.onload = function(){ cb(null); };
      s.onerror = function(){ tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  }
  window.__leafletReady = new Promise(function(resolve, reject){
    loadScript([
      'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
      'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'
    ], function(err){
      if (err || typeof L === 'undefined') { reject(err || new Error('Leaflet not available')); return; }
      loadScript([
        'https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js',
        'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js',
        'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js'
      ], function(err2){
        if (err2) { reject(err2); return; }
        // d3 + topojson dla globusa (lazy/parallel, nie blokuje appki przy błędzie)
        loadScript([
          'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js',
          'https://unpkg.com/d3@7.9.0/dist/d3.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js'
        ], function(){
          loadScript([
            'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js',
            'https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js'
          ], function(){
            window.__globeReady = (typeof d3 !== 'undefined' && typeof topojson !== 'undefined');
            resolve();
          });
        });
      });
    });
  });
})();
</script>

   ============================================================ */
const API_BASES = [
  'https://de1.api.radio-browser.info/json',
  'https://at1.api.radio-browser.info/json',
  'https://nl1.api.radio-browser.info/json'
];

async function apiFetch(path, params = {}) {
  const qs = new URLSearchParams(params).toString();
  let lastErr;
  for (const base of API_BASES) {
    try {
      const r = await fetch(`${base}${path}?${qs}`, {
        headers: { 'User-Agent': 'RadioGardenPL/1.0 PWA' }
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

// Haversine — odległość km między dwoma punktami
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Odrzuć stację jeśli geo niezgodne z kodem kraju (>2500 km od centroidu)
function geoSanityOk(s) {
  const cc = (s.countrycode || '').toUpperCase();
  const center = COUNTRY_CENTERS[cc];
  if (!center) return true; // brak referencji - dajemy szansę
  const lat = parseFloat(s.geo_lat), lng = parseFloat(s.geo_long);
  if (!isFinite(lat) || !isFinite(lng)) return false;
  // (0,0) to klasyczny "fallback" błędnych geo - od razu odrzuć
  if (Math.abs(lat) < 0.5 && Math.abs(lng) < 0.5) return false;
  return distKm(lat, lng, center[0], center[1]) < 2500;
}

function normalizeStation(s) {
  return {
    uuid: s.stationuuid,
    name: (s.name || '').trim().slice(0, 80),
    url: s.url_resolved,
    country: s.country || s.countrycode || '',
    countryCode: (s.countrycode || '').toUpperCase(),
    tags: (s.tags || '').split(',').filter(Boolean).slice(0, 4).join(' · '),
    tagsRaw: (s.tags || '').toLowerCase(),
    favicon: s.favicon || '',
    bitrate: s.bitrate || 0,
    codec: s.codec || '',
    votes: s.votes || 0,
    lat: parseFloat(s.geo_lat),
    lng: parseFloat(s.geo_long)
  };
}

const UNSUPPORTED_CODECS = /^(HLS|FLAC|OPUS\+OGG|AAC\+HLS)$/i;
const PLAYLIST_EXT = /\.(m3u8|m3u|pls|asx|ram)(\?|$)/i;

function isStationValid(s) {
  if (!s.url_resolved || !s.name || !s.geo_lat || !s.geo_long) return false;
  if (!s.url_resolved.startsWith('https://')) return false;
  if (s.codec && UNSUPPORTED_CODECS.test(s.codec)) return false;
  if (PLAYLIST_EXT.test(s.url_resolved)) return false;
  if (!geoSanityOk(s)) return false;
  return true;
}

async function loadStations() {
  setLoadingStatus('Pobieranie stacji (tryb optymalny)...');
  try {
    // Pobieramy tylko dwie główne paczki zamiast setek zapytań per kraj
    const results = await Promise.allSettled([
      // Top 4000 stacji z całego świata (z informacją geo)
      apiFetch('/stations/search', {
        limit: 4000, 
        has_geo_info: 'true', 
        is_https: 'true', 
        hidebroken: 'true',
        order: 'votes', 
        reverse: 'true'
      }),
      // Dodatkowo 200 polskich stacji dla pewności pełnego pokrycia u nas
      apiFetch('/stations/bycountrycodeexact/PL', {
        limit: 200, 
        hidebroken: 'true', 
        order: 'votes', 
        reverse: 'true'
      })
    ]);

    const allRaw = [];
    results.forEach(r => {
      if (r.status === 'fulfilled' && Array.isArray(r.value)) {
        allRaw.push(...r.value);
      }
    });

    setLoadingStatus('Deduplikacja danych...');
    const seen = new Set();
    const result = [];
    
    for (const s of allRaw) {
      if (seen.has(s.stationuuid)) continue;
      seen.add(s.stationuuid);
      if (isStationValid(s)) {
        result.push(normalizeStation(s));
      }
    }

    console.log('[stations] Załadowano optymalną liczbę:', result.length);
    return result;
  } catch (e) {
    setLoadingStatus('Błąd: ' + e.message);
    return [];
  }
}

let map, cluster, tileLayer;

function createTileLayer() {
  // Tryb ciemny: Carto Dark Matter | Tryb jasny: Carto Voyager (subtelny, gold-friendly)
  if (state.theme === 'light') {
    return L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap · © CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    });
  }
  return L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap · © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  });
}

function initMap() {
  map = L.map('map', {
    center: [42, 16],
    zoom: 3,
    minZoom: 2,
    maxZoom: 12,
    worldCopyJump: true,
    zoomControl: true,
    attributionControl: true
  });

  tileLayer = createTileLayer();
  tileLayer.addTo(map);

  cluster = L.markerClusterGroup({
    maxClusterRadius: 45,
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    chunkedLoading: true
  });
  map.addLayer(cluster);
}

function renderMarkers() {
  cluster.clearLayers();
  state.markers.clear();

  // Filtruj po aktualnym gatunku
  let stations = state.stations;
  if (state.genre && state.genre !== 'all') {
    const pattern = GENRE_TAG_PATTERNS[state.genre];
    if (pattern) stations = stations.filter(s => pattern.test(s.tagsRaw || ''));
  }

  for (const s of stations) {
    const icon = L.divIcon({
      className: '',
      html: '<div class="station-marker-wrap"><div class="station-marker" data-uuid="' + s.uuid + '"></div></div>',
      iconSize: [44, 44],
      iconAnchor: [22, 22]
    });
    const m = L.marker([s.lat, s.lng], { icon, station: s });
    m.on('click', () => playStation(s));
    cluster.addLayer(m);
    state.markers.set(s.uuid, m);
  }
}

function highlightMarker(uuid) {
  // remove all active classes
  document.querySelectorAll('.station-marker.active').forEach(el => el.classList.remove('active'));
  // add to current
  if (uuid) {
    const m = state.markers.get(uuid);
    if (m && m._icon) {
      const dot = m._icon.querySelector('.station-marker');
      if (dot) dot.classList.add('active');
    } else if (m) {
      // marker is in a cluster — find cluster's parent visible marker is null
      // we'll just zoom to it
      const station = state.byUuid.get(uuid);
      if (station) map.setView([station.lat, station.lng], Math.max(map.getZoom(), 6));
    }
  }
}

   PLAYER
   ============================================================ */
function playStation(station) {
  if (!station) return;
  state.current = station;
  state.isLoading = true;

  // UI update
  $('playerName').textContent = station.name;
  $('playerInfo').textContent = [
    flag(station.countryCode) + ' ' + (station.country || station.countryCode),
    station.tags
  ].filter(Boolean).join(' · ').slice(0, 80);

  const fav = $('playerFavicon');
  fav.innerHTML = '';
  if (station.favicon) {
    const img = document.createElement('img');
    img.src = station.favicon;
    img.onerror = () => { fav.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 1 14 0"/><circle cx="12" cy="14" r="2"/><path d="M12 16v6"/></svg>'; };
    fav.appendChild(img);
  } else {
    fav.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 1 14 0"/><circle cx="12" cy="14" r="2"/><path d="M12 16v6"/></svg>';
  }

  $('player').classList.add('visible');
  $('playPauseBtn').classList.add('loading');
  highlightMarker(station.uuid);
  highlightGlobeMarker(station.uuid);
  updateFavToggleBtn();
  updateFavListUi();
  updateSearchListUi();
  pushRecent(station);

  // play audio
  // Sprawdź czy URL nie jest playlistą / nieobsługiwanym formatem (last-mile guard)
  if (/\.(m3u8|m3u|pls|asx|ram)(\?|$)/i.test(station.url)) {
    state.isLoading = false;
    setPlayingUi(false);
    $('playPauseBtn').classList.remove('loading');
    showToast('Format playlisty nieobsługiwany przez przeglądarkę');
    return;
  }
  audio.src = station.url;
  audio.load();
  audio.play().then(() => {
    state.isPlaying = true;
    state.isLoading = false;
    setPlayingUi(true);
    setMediaSession(station);
  }).catch(err => {
    state.isPlaying = false;
    state.isLoading = false;
    setPlayingUi(false);
    $('playPauseBtn').classList.remove('loading');
    // NotAllowedError = autoplay blokowane, NotSupportedError = format/CORS
    if (err && err.name === 'NotAllowedError') {
      showToast('Tap ▶ ponownie aby odtworzyć');
    } else if (err && err.name === 'NotSupportedError') {
      showToast('Stream nieobsługiwany (' + (station.codec || 'unknown') + ')');
    } else {
      showToast('Stream offline lub niedostępny');
    }
  });
}

function setPlayingUi(playing) {
  state.isPlaying = playing;
  $('playIcon').style.display = playing ? 'none' : 'block';
  $('pauseIcon').style.display = playing ? 'block' : 'none';
  $('playerEq').classList.toggle('playing', playing);
  $('playPauseBtn').classList.remove('loading');
}

function togglePlayPause() {
  if (!state.current) return;
  if (state.isPlaying) {
    audio.pause();
  } else {
    $('playPauseBtn').classList.add('loading');
    audio.play().catch(() => {
      $('playPauseBtn').classList.remove('loading');
      showToast('Stream nieosiągalny');
    });
  }
}

audio.addEventListener('playing', () => setPlayingUi(true));
audio.addEventListener('pause', () => setPlayingUi(false));
audio.addEventListener('ended', () => setPlayingUi(false));
audio.addEventListener('error', () => {
  setPlayingUi(false);
  $('playPauseBtn').classList.remove('loading');
  if (!state.current) return;
  // MediaError codes: 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED
  const code = audio.error && audio.error.code;
  let msg = 'Stream offline';
  if (code === 4) msg = 'Format strumienia nieobsługiwany';
  else if (code === 3) msg = 'Błąd dekodowania audio';
  else if (code === 2) msg = 'Błąd sieci - stream niedostępny';
  showToast(msg);
});

function setMediaSession(station) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: station.name,
    artist: station.country || station.countryCode || '',
    album: station.tags || 'Radio',
    artwork: station.favicon ? [{ src: station.favicon, sizes: '256x256', type: 'image/png' }] : []
  });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('stop', () => audio.pause());
}

function isFav(uuid) {
  return state.favorites.some(f => f.uuid === uuid);

function toggleFav(station) {
  const idx = state.favorites.findIndex(f => f.uuid === station.uuid);
  if (idx >= 0) {
    state.favorites.splice(idx, 1);
    showToast('Usunięto z ulubionych');
  } else {
    state.favorites.unshift({
      uuid: station.uuid,
      name: station.name,
      url: station.url,
      country: station.country,
      countryCode: station.countryCode,
      tags: station.tags,
      favicon: station.favicon,
      bitrate: station.bitrate,
      codec: station.codec,
      lat: station.lat, lng: station.lng,
      votes: station.votes
    });
    showToast('Dodano do ulubionych');
  }
  saveFavs();
  updateFavToggleBtn();
  updateFavBadge();
  updateFavListUi();
  updateSearchListUi();
}

  localStorage.setItem('rg_favorites', JSON.stringify(state.favorites));

  electronic: /\b(electronic|edm|techno|house|trance|dubstep|drum ?and ?bass|dnb)\b/,
  rock:       /\b(rock|metal|punk|grunge|alternative)\b/,
  jazz:       /\b(jazz|swing|bebop|blues)\b/,
  classical:  /\b(classical|opera|orchestra|symphon|baroque)\b/
};

function applyFilter(stations, filter, query) {
  let list = stations;
  // Genre filter (działa równolegle z country filter)
  if (state.genre && state.genre !== 'all') {
    const pattern = GENRE_TAG_PATTERNS[state.genre];
    if (pattern) list = list.filter(s => pattern.test(s.tagsRaw || ''));
  }
  if (filter === 'near' && state.userLatLng) {
    const [lat, lng] = state.userLatLng;
    list = list.map(s => ({
      ...s,
      _dist: Math.hypot(s.lat - lat, s.lng - lng)
    })).sort((a, b) => a._dist - b._dist).slice(0, 100);
  } else if (filter !== 'all' && filter !== 'near') {
    list = list.filter(s => s.countryCode === filter);
  }
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.country || '').toLowerCase().includes(q) ||
      (s.tags || '').toLowerCase().includes(q)
    );
  }
  return list.slice(0, 200);
}

function renderStationList(container, stations, emptyMsg) {
  if (stations.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="deco">— Cisza —</div>' + emptyMsg + '</div>';
    return;
  }
  container.innerHTML = '';
  for (const s of stations) {
    const row = document.createElement('div');
    row.className = 'station-row' + (state.current && state.current.uuid === s.uuid ? ' active' : '');
    row.innerHTML = `
      <div class="station-favicon">
        ${s.favicon ? `<img src="${s.favicon}" onerror="this.parentElement.innerHTML='<svg fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'2\\' viewBox=\\'0 0 24 24\\'><path d=\\'M5 12a7 7 0 1 1 14 0\\'/><circle cx=\\'12\\' cy=\\'14\\' r=\\'2\\'/><path d=\\'M12 16v6\\'/></svg>'">` : `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 1 14 0"/><circle cx="12" cy="14" r="2"/><path d="M12 16v6"/></svg>`}
      </div>
      <div class="station-meta">
        <div class="station-name">${escapeHtml(s.name)}</div>
        <div class="station-info">${flag(s.countryCode)} ${escapeHtml(s.country || s.countryCode || '—')}${s.tags ? ' · ' + escapeHtml(s.tags) : ''}${s.bitrate ? ' · ' + s.bitrate + ' kbps' : ''}</div>
      </div>
      <button class="station-fav-btn ${isFav(s.uuid) ? 'active' : ''}" data-uuid="${s.uuid}" aria-label="Ulubione">
        <svg fill="currentColor" viewBox="0 0 24 24" width="18" height="18"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    `;
    row.addEventListener('click', (e) => {
      if (e.target.closest('.station-fav-btn')) return;
      playStation(s);
      // pan map to station
      map.setView([s.lat, s.lng], Math.max(map.getZoom(), 5), { animate: true });
    });
    row.querySelector('.station-fav-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(s);
    });
    container.appendChild(row);
  }
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

   ============================================================ */
async function applyView(view) {
  state.view = view;
  localStorage.setItem('rg_view', view);
  $('iconGlobe').style.display = view === 'map' ? 'block' : 'none';
  $('iconMap').style.display = view === 'map' ? 'none' : 'block';
  $('map').style.display = view === 'map' ? 'block' : 'none';
  $('globeContainer').classList.toggle('visible', view === 'globe');
  if (view === 'globe') {
    if (!globe.initialized) await globe.init();
    else {
      globe.resize(); globe.recalcScale(); globe.draw(); globe.renderMarkers(); globe.drawCelestial();
      // Upewnij się że pętla rAF działa (mogła zostać zatrzymana przy wyjściu z globusa)
      globe.startCelestialLoop();
    }
    // Tryb kosmiczny
    if (state.cosmos.on) {
      cosmos.enable();
    }
  } else if (map) {
    cosmos.stopAnimation();
    // Zatrzymaj pętlę celestial gdy nie ma globusa (oszczędność CPU)
    globe.stopCelestialLoop();
    setTimeout(() => map.invalidateSize(), 50);
  }
}

function pushRecent(station) {
  if (!station) return;
  const minimal = {
    uuid: station.uuid,
    name: station.name,
    country: station.country,
    countryCode: station.countryCode,
    url: station.url,
    favicon: station.favicon,
    lat: station.lat,
    lng: station.lng,
    tags: station.tags,

  state.recents = [minimal, ...state.recents.filter(r => r.uuid !== station.uuid)].slice(0, 15);
  localStorage.setItem('rg_recents', JSON.stringify(state.recents));
  updateRecentListUi();

  const container = $('recentResults');

  if (!state.recents.length) {
    container.innerHTML = '<div class="recent-empty">Brak historii. Zacznij słuchać aby zobaczyć tu stacje.</div>';

  }
  for (const r of state.recents) {
    const row = document.createElement('div');
    row.className = 'recent-row';
    const minutes = Math.round((Date.now() - r.ts) / 60000);
    let when;
    if (minutes < 1) when = 'przed chwilą';
    else if (minutes < 60) when = minutes + ' min temu';
    else if (minutes < 1440) when = Math.round(minutes / 60) + ' godz. temu';
    else when = Math.round(minutes / 1440) + ' dni temu';
    row.innerHTML = `
      <div class="rr-favicon">
        ${r.favicon ? `<img src="${escapeHtml(r.favicon)}" onerror="this.style.display='none';this.parentElement.innerHTML='<svg fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'2\\' viewBox=\\'0 0 24 24\\'><path d=\\'M5 12a7 7 0 1 1 14 0\\'/><circle cx=\\'12\\' cy=\\'14\\' r=\\'2\\'/><path d=\\'M12 16v6\\'/></svg>'">` : '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 1 14 0"/><circle cx="12" cy="14" r="2"/><path d="M12 16v6"/></svg>'}
      </div>
      <div class="rr-info">
        <div class="rr-name">${escapeHtml(r.name)}</div>
        <div class="rr-meta">${flag(r.countryCode)} ${escapeHtml(r.country || r.countryCode || '—')} · ${when}</div>
      </div>

    row.addEventListener('click', () => {

      const live = state.byUuid.get(r.uuid) || r;
      playStation(live);
    });
    container.appendChild(row);
  }
