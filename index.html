/* ============================================================
   GLOBE (3D orthographic via D3)
   ============================================================ */
const globe = {
  initialized: false,
  rotation: [20, -25, 0],
  scale: 0,
  width: 0,
  height: 0,
  projection: null,
  path: null,
  svg: null,
  land: null,
  graticule: null,
  markersG: null,
  worldData: null,
  nightG: null,
  sunMoonG: null,
  celestialUpdateTimer: null,
  celestialRafId: null,
  lastCelestialTs: 0,

  async init() {
    if (typeof d3 === 'undefined' || typeof topojson === 'undefined') {
      showToast('Globus niedostępny (offline?)');
      return;
    }
    if (this.initialized) return;
    this.svg = d3.select('#globeSvg');
    this.resize();
    this.projection = d3.geoOrthographic().clipAngle(90).rotate(this.rotation);
    this.recalcScale();
    this.path = d3.geoPath(this.projection);

    // Sphere outline + graticule + lands + night overlay + markers + sun/moon (kolejność = z-order)
    this.svg.append('path').attr('class', 'globe-sphere').datum({type: 'Sphere'});
    this.graticule = this.svg.append('path').attr('class', 'globe-graticule').datum(d3.geoGraticule10());
    this.land = this.svg.append('path').attr('class', 'globe-land');
    // Półcień nocny - rysowany NAD lądami ale POD markerami
    this.nightG = this.svg.append('g').attr('class', 'globe-night-group');
    this.nightG.append('path').attr('class', 'globe-night');
    this.nightG.append('path').attr('class', 'globe-night-edge');
    // Markery - klikalne
    this.markersG = this.svg.append('g').attr('class', 'globe-markers-group');
    // Słońce + Księżyc - na samej górze
    this.sunMoonG = this.svg.append('g').attr('class', 'globe-sunmoon-group');

    // Pobierz uproszczony world-atlas (~80 KB) - lazy z fallbackiem
    try {
      const sources = [
        'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
        'https://unpkg.com/world-atlas@2/countries-110m.json'
      ];
      let world = null;
      for (const src of sources) {
        try {
          const r = await fetch(src);
          if (r.ok) { world = await r.json(); break; }
        } catch(e){}
      }
      if (!world) throw new Error('atlas not loaded');
      this.worldData = topojson.feature(world, world.objects.countries);
    } catch (e) {
      console.warn('Globe: world atlas failed', e);
      showToast('Globus offline - pokazuję bez konturów lądów');
    }

    this.draw();
    this.renderMarkers();
    this.drawCelestial();
    this.bindDrag();
    this.bindZoom();
    initStarfield();
    this.initialized = true;

    // Aktualizuj pozycję słońca/księżyca/terminatora na żywo (co 1s via rAF)
    this.startCelestialLoop();

    window.addEventListener('resize', () => {
      if (state.view === 'globe') {
        this.resize();
        this.recalcScale();
        this.draw();
        this.renderMarkers();
        this.drawCelestial();
      }
    });
  },

  resize() {
    this.width = window.innerWidth;
    this.height = window.innerHeight;
    if (this.svg) this.svg.attr('viewBox', `0 0 ${this.width} ${this.height}`);
  },

  recalcScale() {
    this.scale = Math.min(this.width, this.height) * 0.42;
    this.projection.scale(this.scale).translate([this.width / 2, this.height / 2]);
  },

  draw() {
    if (!this.path) return;
    this.svg.select('.globe-sphere').attr('d', this.path);
    this.graticule.attr('d', this.path);
    if (this.worldData) {
      this.land.datum(this.worldData).attr('d', this.path);
    }
  },

  renderMarkers() {
    if (!this.markersG) return;
    // filtruj zgodnie z aktualnym genre
    let stations = state.stations;
    if (state.genre && state.genre !== 'all') {
      const pattern = GENRE_TAG_PATTERNS[state.genre];
      if (pattern) stations = stations.filter(s => pattern.test(s.tagsRaw || ''));
    }
    // Każdy marker = grupa: większy transparentny krąg (hit-area 16px) + widoczna kropka 5px
    const sel = this.markersG.selectAll('g.globe-marker-g').data(stations, d => d.uuid);
    sel.exit().remove();
    const enter = sel.enter().append('g')
      .attr('class', 'globe-marker-g')
      .style('cursor', 'pointer');
    // Niewidzialna duża hit-area
    enter.append('circle')
      .attr('class', 'globe-marker-hit')
      .attr('r', 14);
    // Widoczna kropka
    enter.append('circle')
      .attr('class', 'globe-marker')
      .attr('r', 5);
    enter.append('title').text(d => d.name + (d.country ? ' · ' + d.country : ''));
    // Click handler na całej grupie - z stopPropagation żeby nie odpalić drag
    enter.on('pointerdown', function(event, d) {
      // Oznacz że pointerdown trafił na marker - drag w bindDrag to zignoruje
      event.stopPropagation();
      this.__markerDownAt = [event.clientX, event.clientY];
    });
    enter.on('pointerup', function(event, d) {
      event.stopPropagation();
      const downAt = this.__markerDownAt;
      this.__markerDownAt = null;
      if (!downAt) return;
      const dx = event.clientX - downAt[0];
      const dy = event.clientY - downAt[1];
      // Tylko jeśli pointer się prawie nie poruszył = klik a nie drag
      if (Math.hypot(dx, dy) < 8) {
        playStation(d);
      }
    });
    this.updateMarkerPositions();
  },

  updateMarkerPositions() {
    if (!this.markersG || !this.projection) return;
    const rotate = this.projection.rotate();
    this.markersG.selectAll('g.globe-marker-g').each((d, i, nodes) => {
      const node = d3.select(nodes[i]);
      const visible = isVisibleOnGlobe(d.lat, d.lng, rotate);
      if (!visible) {
        node.style('display', 'none');
        return;
      }
      const pt = this.projection([d.lng, d.lat]);
      if (!pt || isNaN(pt[0])) { node.style('display', 'none'); return; }
      node.style('display', null).attr('transform', `translate(${pt[0]},${pt[1]})`);
    });
  },

  /* ============================================================
     DAY/NIGHT TERMINATOR + SUN + MOON
     Bazuje na realnym czasie UTC. Pozycje słońca/księżyca obliczane
     z prostych formuł astronomicznych (dokładność ~0.5°, wystarcza wizualnie).
     ============================================================ */
  drawCelestial() {
    if (!this.nightG || !this.sunMoonG || !this.projection) return;

    const now = new Date();
    const sun = computeSunPosition(now);   // {lat, lng} subsolar point
    const moon = computeMoonPosition(now); // {lat, lng} sublunar point + phase

    // === Terminator: półkula nocna jako geoCircle 90° wokół ANTYsolarnego punktu ===
    const antiSolar = [sun.lng + 180, -sun.lat];
    const nightCircle = d3.geoCircle().center(antiSolar).radius(90)();
    this.nightG.select('.globe-night').datum(nightCircle).attr('d', this.path);
    this.nightG.select('.globe-night-edge').datum(nightCircle).attr('d', this.path);

    // === Słońce ===
    const rotate = this.projection.rotate();
    const sunVisible = isVisibleOnGlobe(sun.lat, sun.lng, rotate);
    const moonVisible = isVisibleOnGlobe(moon.lat, moon.lng, rotate);

    // Czyść poprzednie
    this.sunMoonG.selectAll('*').remove();

    if (sunVisible) {
      const sp = this.projection([sun.lng, sun.lat]);
      if (sp && !isNaN(sp[0])) {
        const sg = this.sunMoonG.append('g').attr('class', 'globe-sun-group');
        // Promienie
        const rays = 12;
        const r1 = 12, r2 = 18;
        for (let i = 0; i < rays; i++) {
          const ang = (i / rays) * Math.PI * 2;
          sg.append('line')
            .attr('class', 'globe-sun-rays')
            .attr('x1', sp[0] + Math.cos(ang) * r1)
            .attr('y1', sp[1] + Math.sin(ang) * r1)
            .attr('x2', sp[0] + Math.cos(ang) * r2)
            .attr('y2', sp[1] + Math.sin(ang) * r2);
        }
        sg.append('circle')
          .attr('class', 'globe-sun')
          .attr('cx', sp[0]).attr('cy', sp[1]).attr('r', 9);
        sg.append('title').text(`☀ Słońce · ${sun.lat.toFixed(1)}°, ${sun.lng.toFixed(1)}°`);
      }
    }

    if (moonVisible) {
      const mp = this.projection([moon.lng, moon.lat]);
      if (mp && !isNaN(mp[0])) {
        const mg = this.sunMoonG.append('g').attr('class', 'globe-moon-group');
        const mr = 7;
        // Pełna tarcza
        mg.append('circle')
          .attr('class', 'globe-moon')
          .attr('cx', mp[0]).attr('cy', mp[1]).attr('r', mr);
        // Faza księżyca - cień (nakładka)
        // phase: 0 = nów, 0.25 = pierwsza kwadra, 0.5 = pełnia, 0.75 = ostatnia kwadra
        const phase = moon.phase;
        if (phase < 0.5) {
          // Faza rosnąca - cień po lewej stronie tarczy (z perspektywy obserwatora)
          // Im bliżej 0 - tym więcej cienia
          const shadowAmount = 1 - (phase * 2); // 1 → 0
          if (shadowAmount > 0.05) {
            const cx2 = mp[0] - mr * shadowAmount;
            mg.append('ellipse')
              .attr('class', 'globe-moon-shadow')
              .attr('cx', cx2).attr('cy', mp[1])
              .attr('rx', mr * shadowAmount).attr('ry', mr);
            // dodatkowo zakryj lewą połowę
            mg.append('path')
              .attr('class', 'globe-moon-shadow')
              .attr('d', `M ${mp[0]} ${mp[1]-mr} A ${mr} ${mr} 0 0 0 ${mp[0]} ${mp[1]+mr} Z`);
          }
        } else {
          // Faza malejąca - cień po prawej stronie
          const shadowAmount = (phase - 0.5) * 2; // 0 → 1
          if (shadowAmount > 0.05) {
            const cx2 = mp[0] + mr * shadowAmount;
            mg.append('ellipse')
              .attr('class', 'globe-moon-shadow')
              .attr('cx', cx2).attr('cy', mp[1])
              .attr('rx', mr * shadowAmount).attr('ry', mr);
            mg.append('path')
              .attr('class', 'globe-moon-shadow')
              .attr('d', `M ${mp[0]} ${mp[1]-mr} A ${mr} ${mr} 0 0 1 ${mp[0]} ${mp[1]+mr} Z`);
          }
        }
        const phaseName = describeMoonPhase(phase);
        mg.append('title').text(`🌙 Księżyc · ${phaseName} · ${moon.lat.toFixed(1)}°, ${moon.lng.toFixed(1)}°`);
      }
    }
  },

  startCelestialLoop() {
    if (this.celestialRafId) return; // już działa
    const loop = (ts) => {
      if (state.view === 'globe' && ts - this.lastCelestialTs >= 1000) {
        this.drawCelestial();
        this.lastCelestialTs = ts;
      }
      this.celestialRafId = requestAnimationFrame(loop);
    };
    this.celestialRafId = requestAnimationFrame(loop);
  },

  stopCelestialLoop() {
    if (this.celestialRafId) {
      cancelAnimationFrame(this.celestialRafId);
      this.celestialRafId = null;
    }
  },

  bindDrag() {
    let dragStart = null;
    let rotStart = null;
    const sensitivity = 0.4;
    const node = document.getElementById('globeContainer');
    const onPointerDown = (e) => {
      // Jeśli pointerdown trafił w marker (lub jego hit-area lub title) - nie inicjuj drag
      if (e.target.closest('.globe-marker-g')) return;
      dragStart = [e.clientX, e.clientY];
      rotStart = this.projection.rotate();
      try { node.setPointerCapture(e.pointerId); } catch(_) {}
    };
    const onPointerMove = (e) => {
      if (!dragStart) return;
      const dx = e.clientX - dragStart[0];
      const dy = e.clientY - dragStart[1];
      const newRot = [
        rotStart[0] + dx * sensitivity,
        Math.max(-90, Math.min(90, rotStart[1] - dy * sensitivity)),
        rotStart[2]
      ];
      this.projection.rotate(newRot);
      this.rotation = newRot;
      this.draw();
      this.updateMarkerPositions();
      this.drawCelestial();
    };
    const onPointerUp = (e) => {
      dragStart = null;
      try { node.releasePointerCapture(e.pointerId); } catch(_){}
    };
    node.addEventListener('pointerdown', onPointerDown);
    node.addEventListener('pointermove', onPointerMove);
    node.addEventListener('pointerup', onPointerUp);
    node.addEventListener('pointercancel', onPointerUp);
  },

  bindZoom() {
    const node = document.getElementById('globeContainer');
    // Click na pustą część globusa zamyka panele
    let downAt = null;
    node.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.globe-marker-g')) return;
      downAt = [e.clientX, e.clientY];
    });
    node.addEventListener('pointerup', (e) => {
      if (!downAt) return;
      const dx = e.clientX - downAt[0], dy = e.clientY - downAt[1];
      if (Math.hypot(dx, dy) < 5 && !e.target.closest('.globe-marker-g')) {
        closeAllPanels();
      }
      downAt = null;
    });
    node.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 0.85;
      this.scale = Math.max(150, Math.min(3000, this.scale * factor));
      this.projection.scale(this.scale);
      this.draw();
      this.updateMarkerPositions();
      this.drawCelestial();
    }, { passive: false });
    // pinch zoom (basic)
    let pinchStart = null;
    node.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        pinchStart = { d: pinchDist(e.touches), s: this.scale };
      }
    }, { passive: true });
    node.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && pinchStart) {
        e.preventDefault();
        const d = pinchDist(e.touches);
        this.scale = Math.max(150, Math.min(3000, pinchStart.s * (d / pinchStart.d)));
        this.projection.scale(this.scale);
        this.draw();
        this.updateMarkerPositions();
        this.drawCelestial();
      }
    }, { passive: false });
    node.addEventListener('touchend', () => { pinchStart = null; });
  }
};

/* ============================================================
   COSMOS MODE - orbity, ISS, satelity, śmieci, komety, meteory
   ============================================================ */
const cosmos = {
  initialized: false,
  rafId: null,
  lastFrame: 0,
  // Warstwy SVG (grupy)
  orbitsG: null,
  trailsG: null,
  satellitesG: null,
  debrisG: null,
  cometsG: null,
  // Stan obiektów
  satellites: [],     // {type, alt, inclination, raan, omega0, period, label}
  debris: [],         // {emoji, alt, inclination, raan, omega0, period, label, spin}
  comets: [],         // {start, end, age, lifetime, color}
  meteors: [],        // (na canvasie globeStars)
  // ISS - real position via SGP4-light
  issState: { lat: 0, lng: 0, alt: 408 },
  issTrail: [],       // [[lat,lng], ...]
  // Czas startu animacji
  t0: Date.now(),
  // Konfiguracja kosmiczna
  EARTH_MU: 398600.4418, // km^3/s^2
  EARTH_R: 6371,         // km

  init() {
    if (this.initialized) return;
    if (!globe.svg) return;
    // Warstwy w odpowiedniej kolejności (z-order)
    // Komety - daleko (pod globusem) i osobno bardzo daleko (nad)
    // Najlepiej: orbity i satelity NAD globusem, komety przelatujące przed/za
    this.orbitsG = globe.svg.append('g').attr('class', 'cosmos-orbits-group');
    this.trailsG = globe.svg.append('g').attr('class', 'cosmos-trails-group');
    this.satellitesG = globe.svg.append('g').attr('class', 'cosmos-satellites-group');
    this.debrisG = globe.svg.append('g').attr('class', 'cosmos-debris-group');
    this.cometsG = globe.svg.append('g').attr('class', 'cosmos-comets-group');

    this.generateSatellites();
    this.generateDebris();
    this.fetchISSPosition();
    // ISS aktualizuje się co 15s (real API)
    this.issTimer = setInterval(() => this.fetchISSPosition(), 15000);
    this.initialized = true;
  },

  destroy() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
    if (this.issTimer) clearInterval(this.issTimer);
    if (this.orbitsG) this.orbitsG.remove();
    if (this.trailsG) this.trailsG.remove();
    if (this.satellitesG) this.satellitesG.remove();
    if (this.debrisG) this.debrisG.remove();
    if (this.cometsG) this.cometsG.remove();
    this.orbitsG = this.trailsG = this.satellitesG = this.debrisG = this.cometsG = null;
    this.satellites = []; this.debris = []; this.comets = [];
    this.initialized = false;
  },

  // Generowanie zestawu satelitów - mix Starlinków, GPS, GEO
  generateSatellites() {
    const sats = [];
    // Starlinks - LEO, ~550 km, inclination 53°, dużo
    for (let i = 0; i < 30; i++) {
      sats.push({
        type: 'starlink',
        alt: 540 + Math.random() * 30,
        inclination: 53 + (Math.random() - 0.5) * 4,
        raan: Math.random() * 360,
        omega0: Math.random() * 360,
        label: 'STARLINK-' + (1000 + Math.floor(Math.random() * 5000)),
      });
    }
    // GPS - MEO, ~20200 km, inclination 55°
    for (let i = 0; i < 8; i++) {
      sats.push({
        type: 'gps',
        alt: 20180 + Math.random() * 50,
        inclination: 55,
        raan: i * 60,
        omega0: Math.random() * 360,
        label: 'GPS-' + (i + 1),
      });
    }
    // GEO - 35786 km, inclination ~0°
    const geoNames = ['ASTRA-19E', 'HOTBIRD-13B', 'EUTELSAT-7A', 'INTELSAT-901', 'INMARSAT-4F1', 'TURKSAT-4A'];
    for (let i = 0; i < 6; i++) {
      sats.push({
        type: 'geo',
        alt: 35786,
        inclination: 0.5 + (Math.random() - 0.5),
        raan: 0,
        omega0: i * 60 + Math.random() * 30,
        label: geoNames[i],
      });
    }
    // Hubble - LEO, 540 km, inclination 28.5°
    sats.push({
      type: 'starlink', alt: 540, inclination: 28.5,
      raan: Math.random() * 360, omega0: Math.random() * 360,
      label: 'HST (Hubble)',
    });
    // Tiangong - LEO, 380 km, inclination 41.5°
    sats.push({
      type: 'starlink', alt: 380, inclination: 41.5,
      raan: Math.random() * 360, omega0: Math.random() * 360,
      label: 'CSS Tiangong',
    });
    // Nadaj okresy obiegu z wzoru Keplera: T = 2π√(a³/μ)
    for (const s of sats) {
      const a = this.EARTH_R + s.alt; // semi-major axis (km)
      s.period = 2 * Math.PI * Math.sqrt(Math.pow(a, 3) / this.EARTH_MU); // sekundy
    }
    this.satellites = sats;
  },

  // Easter egg: śmieci kosmiczne z osobowością
  generateDebris() {
    const items = [
      { emoji: '🥫', label: 'Puszka po Pepsi (1996)', alt: 410 },
      { emoji: '👟', label: 'But astronauty Apollo 13', alt: 600 },
      { emoji: '🔧', label: 'Klucz Sunity Williams (STS-126)', alt: 400 },
      { emoji: '📷', label: 'Kamera Michaela Collinsa (Gemini 10)', alt: 550 },
      { emoji: '🧤', label: 'Rękawica Eda White (Gemini 4)', alt: 450 },
      { emoji: '🛏', label: 'Worek śmieci ISS (2007)', alt: 420 },
      { emoji: '🔩', label: 'Śrubka Mir', alt: 380 },
      { emoji: '🪥', label: 'Szczoteczka kosmiczna', alt: 470 },
      { emoji: '📡', label: 'Antena Cosmos-1408 (debris 2021)', alt: 480 },
      { emoji: '🛰', label: 'Iridium-33 fragment', alt: 790 },
      { emoji: '🪨', label: 'Fragment Long March 5B', alt: 320 },
      { emoji: '🥄', label: 'Łyżka z misji Skylab', alt: 430 },
      { emoji: '👜', label: 'Torba Heidemarie Stefanyshyn-Piper (STS-126)', alt: 460 },
      { emoji: '🔋', label: 'Bateria EP-9 z ISS', alt: 410 },
      { emoji: '🪐', label: 'Roadster Elona Muska (test heliocentryczny)', alt: 999999 },
    ];
    const debris = items.map((it, i) => ({
      ...it,
      inclination: 20 + Math.random() * 80,
      raan: Math.random() * 360,
      omega0: Math.random() * 360,
      spin: Math.random() * 360,  // kąt obrotu emoji
      spinSpeed: (Math.random() - 0.5) * 180, // °/s
    }));
    for (const d of debris) {
      const a = this.EARTH_R + d.alt;
      d.period = 2 * Math.PI * Math.sqrt(Math.pow(a, 3) / this.EARTH_MU);
    }
    this.debris = debris;
  },

  // Pobiera pozycję ISS z otwartego API (open-notify lub wheretheiss.at)
  async fetchISSPosition() {
    try {
      // wheretheiss.at - prosty, CORS-friendly, bez klucza
      const r = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
      if (!r.ok) throw new Error('iss api');
      const data = await r.json();
      const lat = parseFloat(data.latitude);
      const lng = parseFloat(data.longitude);
      const alt = parseFloat(data.altitude); // km
      if (isFinite(lat) && isFinite(lng)) {
        this.issState = { lat, lng, alt: alt || 408 };
        // dodaj do śladu
        this.issTrail.push([lat, lng, Date.now()]);
        // Usuń stare punkty (>30 minut = 1 obieg)
        const cutoff = Date.now() - 30 * 60 * 1000;
        this.issTrail = this.issTrail.filter(p => p[2] > cutoff);
      }
    } catch (e) {
      // Fallback - propagujemy lokalnie z ostatniej znanej pozycji
      // (lub używamy estymowanej średniej dla ISS: ~7.66 km/s, period 92.68 min)
    }
  },

  // Główna pętla animacji
  startAnimation() {
    if (this.rafId) return;
    const tick = (timestamp) => {
      if (state.view !== 'globe' || !state.cosmos.on) {
        this.rafId = null;
        return;
      }
      const dt = this.lastFrame ? (timestamp - this.lastFrame) / 1000 : 0.016;
      this.lastFrame = timestamp;
      this.tick(dt);
      this.rafId = requestAnimationFrame(tick);
    };
    this.rafId = requestAnimationFrame(tick);
  },

  stopAnimation() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
    this.lastFrame = 0;
  },

  // Każda klatka
  tick(dt) {
    if (!globe.projection) return;
    const tNow = (Date.now() - this.t0) / 1000;
    const cfg = state.cosmos;

    // Komety - dodawaj nowe co ~15-30 sekund jeśli aktywne
    if (cfg.comets) {
      if (this.comets.length < 2 && Math.random() < 0.005) {
        this.spawnComet();
      }
      for (const c of this.comets) c.age += dt;
      this.comets = this.comets.filter(c => c.age < c.lifetime);
    } else {
      this.comets = [];
    }

    this.draw(tNow);
  },

  spawnComet() {
    // Komety lecą z jednej krawędzi do drugiej, lekko przez środek
    const W = globe.width, H = globe.height;
    const side = Math.floor(Math.random() * 4);
    let sx, sy, ex, ey;
    if (side === 0) { sx = -50; sy = Math.random() * H; }
    else if (side === 1) { sx = W + 50; sy = Math.random() * H; }
    else if (side === 2) { sx = Math.random() * W; sy = -50; }
    else { sx = Math.random() * W; sy = H + 50; }
    // Cel - po przeciwnej stronie z lekkim odchyleniem
    ex = W - sx + (Math.random() - 0.5) * 200;
    ey = H - sy + (Math.random() - 0.5) * 200;
    this.comets.push({
      start: [sx, sy], end: [ex, ey],
      age: 0, lifetime: 4 + Math.random() * 3
    });
  },

  // Pozycja satelity w przestrzeni (geocentric ECI -> ECEF -> lat/lng + altitude)
  satellitePosition(sat, t) {
    // Anomalia średnia (rad) - kąt na orbicie
    const meanMotion = (2 * Math.PI) / sat.period; // rad/s
    // Wzbogacenie omega0 (deg) o ruch w czasie
    const M = (sat.omega0 * Math.PI / 180 + meanMotion * t);
    // Dla orbity kołowej anomalia prawdziwa = anomalia średnia
    const inc = sat.inclination * Math.PI / 180;
    const raan = sat.raan * Math.PI / 180;
    const a = this.EARTH_R + sat.alt; // semi-major axis (km)
    // Pozycja w płaszczyźnie orbity
    const xOrb = a * Math.cos(M);
    const yOrb = a * Math.sin(M);
    // Obrót wg inklinacji i RAAN -> ECI (geocentric inertial)
    // Najpierw inklinacja (wokół osi x w płaszczyźnie orbity)
    const xPostInc = xOrb;
    const yPostInc = yOrb * Math.cos(inc);
    const zPostInc = yOrb * Math.sin(inc);
    // Potem RAAN (wokół osi z)
    const xEci = xPostInc * Math.cos(raan) - yPostInc * Math.sin(raan);
    const yEci = xPostInc * Math.sin(raan) + yPostInc * Math.cos(raan);
    const zEci = zPostInc;
    // ECI -> ECEF: obrót Ziemi (Earth rotation rate ~7.2921e-5 rad/s)
    const earthRot = 7.2921159e-5 * t;
    const xEcef = xEci * Math.cos(earthRot) + yEci * Math.sin(earthRot);
    const yEcef = -xEci * Math.sin(earthRot) + yEci * Math.cos(earthRot);
    const zEcef = zEci;
    // ECEF -> lat/lng + altitude (uproszczone - sferyczna Ziemia)
    const r = Math.sqrt(xEcef * xEcef + yEcef * yEcef + zEcef * zEcef);
    const lat = Math.asin(zEcef / r) * 180 / Math.PI;
    const lng = Math.atan2(yEcef, xEcef) * 180 / Math.PI;
    return { lat, lng, alt: r - this.EARTH_R };
  },

  // Rzutuje satelitę na ekran z uwzględnieniem wysokości orbity
  // Globus ma stały scale, satelita jest "wyżej" więc rzucamy go DALEJ od centrum globusa
  projectSatellite(satPos) {
    if (!globe.projection) return null;
    const rotate = globe.projection.rotate();
    // Najpierw pozycja na powierzchni Ziemi
    const surfacePt = globe.projection([satPos.lng, satPos.lat]);
    if (!surfacePt) return null;
    // Sprawdź widoczność - dla satelity widoczność jest ŁATWIEJSZA niż dla punktu na powierzchni
    // bo satelita jest wyżej. Rozszerzamy granicę.
    const visAngle = this.satelliteVisibilityAngle(satPos.alt);
    const visible = isVisibleOnGlobeWithMargin(satPos.lat, satPos.lng, rotate, visAngle);
    if (!visible) return null;
    // Skalujemy odległość od środka globusa
    const cx = globe.width / 2, cy = globe.height / 2;
    const earthScreenR = globe.scale; // promień globusa na ekranie
    // Stosunek (r_orbit / r_earth)
    const ratio = (this.EARTH_R + satPos.alt) / this.EARTH_R;
    // Cap - GEO są dramatycznie daleko, ograniczamy do ~3.5x dla wizualizacji
    // żeby mieściły się w viewporcie (real ratio dla GEO = 6.6, dla LEO = 1.06)
    const visualRatio = Math.min(ratio, 1 + (ratio - 1) * 0.5);
    // Wektor od środka do punktu powierzchni
    const dx = surfacePt[0] - cx;
    const dy = surfacePt[1] - cy;
    const len = Math.hypot(dx, dy);
    if (len < 1) return [surfacePt[0], surfacePt[1]];
    // Wektor jednostkowy
    const ux = dx / len;
    const uy = dy / len;
    // Pozycja satelity = punkt powierzchni + wektor radialny * wysokość
    const altScreen = (visualRatio - 1) * earthScreenR;
    return [surfacePt[0] + ux * altScreen, surfacePt[1] + uy * altScreen];
  },

  // Promień horyzontu satelity (deg) - im wyższy, tym więcej widzi
  satelliteVisibilityAngle(alt) {
    const a = this.EARTH_R + alt;
    return Math.acos(this.EARTH_R / a) * 180 / Math.PI;
  },

  // Główne rysowanie wszystkich obiektów kosmicznych
  draw(tNow) {
    if (!globe.svg || !globe.projection) return;
    const cfg = state.cosmos;
    const cx = globe.width / 2, cy = globe.height / 2;
    const earthR = globe.scale;

    // === ORBITY (eliptyczne ścieżki) ===
    if (cfg.orbits) {
      // Pokazujemy 3 reprezentatywne orbity: LEO, MEO, GEO
      const orbits = [
        { alt: 540, inc: 53, name: 'LEO' },     // Starlink
        { alt: 20180, inc: 55, name: 'MEO' },   // GPS - pokazane skompresowane
      ];
      const sel = this.orbitsG.selectAll('ellipse.cosmos-orbit').data(orbits);
      sel.exit().remove();
      const enter = sel.enter().append('ellipse').attr('class', 'cosmos-orbit');
      sel.merge(enter)
        .attr('cx', cx).attr('cy', cy)
        .attr('rx', d => earthR * Math.min(1 + d.alt / this.EARTH_R, 1 + (d.alt / this.EARTH_R) * 0.5))
        .attr('ry', d => earthR * Math.min(1 + d.alt / this.EARTH_R, 1 + (d.alt / this.EARTH_R) * 0.5) * 0.35)
        .attr('transform', d => `rotate(${-15 + d.inc * 0.3} ${cx} ${cy})`);
    } else {
      this.orbitsG.selectAll('ellipse').remove();
    }

    // === ORBITA KSIĘŻYCA ===
    if (cfg.moonOrbit) {
      // Moon avg distance ~384400 km - daleko, więc kompresujemy
      const moonRatio = 1 + (384400 / this.EARTH_R - 1) * 0.025;
      const moonRx = earthR * moonRatio;
      const moonRy = moonRx * 0.4;
      let moonOrb = this.orbitsG.select('ellipse.moon-orbit');
      if (moonOrb.empty()) {
        moonOrb = this.orbitsG.append('ellipse').attr('class', 'cosmos-orbit moon-orbit');
      }
      moonOrb.attr('cx', cx).attr('cy', cy)
        .attr('rx', moonRx).attr('ry', moonRy)
        .attr('transform', `rotate(-8 ${cx} ${cy})`);
    } else {
      this.orbitsG.select('ellipse.moon-orbit').remove();
    }

    // === ISS ===
    // ISS rysuję jako satelitę zaczepionego na pozycji rzeczywistej
    if (cfg.iss) {
      // ISS trail - mapuj punkty śladu na ekran (pomijaj te niewidoczne)
      const trailPts = [];
      const rotate = globe.projection.rotate();
      for (const [lat, lng, ts] of this.issTrail) {
        if (!isVisibleOnGlobe(lat, lng, rotate)) { trailPts.push(null); continue; }
        const surfacePt = globe.projection([lng, lat]);
        if (!surfacePt) { trailPts.push(null); continue; }
        // ISS na 408 km - bardzo blisko powierzchni, marker tuż nad
        const ratio = 1 + 408 / this.EARTH_R;
        const dx = surfacePt[0] - cx, dy = surfacePt[1] - cy;
        const len = Math.hypot(dx, dy);
        if (len < 1) { trailPts.push([surfacePt[0], surfacePt[1]]); continue; }
        const altScreen = (ratio - 1) * earthR * 0.5;
        trailPts.push([surfacePt[0] + dx/len * altScreen, surfacePt[1] + dy/len * altScreen]);
      }
      // Rysuj trail jako poliline (z przerwami przy nullach)
      let trailG = this.trailsG.select('g.iss-trail-g');
      if (trailG.empty()) trailG = this.trailsG.append('g').attr('class', 'iss-trail-g');
      const segments = [];
      let cur = [];
      for (const p of trailPts) {
        if (p) cur.push(p);
        else if (cur.length > 1) { segments.push(cur); cur = []; }
        else cur = [];
      }
      if (cur.length > 1) segments.push(cur);
      const segSel = trailG.selectAll('path.cosmos-iss-trail').data(segments);
      segSel.exit().remove();
      const segEnter = segSel.enter().append('path').attr('class', 'cosmos-iss-trail');
      segSel.merge(segEnter).attr('d', s => 'M ' + s.map(p => p.join(',')).join(' L '));

      // ISS marker
      const issPos = this.issState;
      const issScreen = this.projectSatellite({ lat: issPos.lat, lng: issPos.lng, alt: issPos.alt });
      let issG = this.satellitesG.select('g.iss-marker-g');
      if (issG.empty()) {
        issG = this.satellitesG.append('g').attr('class', 'iss-marker-g').style('cursor', 'pointer');
        issG.append('rect').attr('class', 'cosmos-iss')
          .attr('x', -7).attr('y', -3)
          .attr('width', 14).attr('height', 6)
          .attr('rx', 1);
        issG.append('line').attr('x1', -10).attr('y1', 0).attr('x2', -7).attr('y2', 0)
          .attr('stroke', '#4ade80').attr('stroke-width', 1.5);
        issG.append('line').attr('x1', 7).attr('y1', 0).attr('x2', 10).attr('y2', 0)
          .attr('stroke', '#4ade80').attr('stroke-width', 1.5);
        issG.append('text').attr('class', 'cosmos-label')
          .attr('y', -10).attr('x', 0).attr('text-anchor', 'middle')
          .text('ISS');
        issG.append('title').text(`ISS · International Space Station\n${issPos.lat.toFixed(2)}°, ${issPos.lng.toFixed(2)}° · ${issPos.alt.toFixed(0)} km`);
        issG.on('click', () => {
          showToast(`🛰 ISS · ${issPos.lat.toFixed(2)}°, ${issPos.lng.toFixed(2)}° · ${issPos.alt.toFixed(0)} km nad Ziemią`, 4000);
        });
      }
      if (issScreen) {
        issG.style('display', null).attr('transform', `translate(${issScreen[0]},${issScreen[1]})`);
        issG.select('title').text(`ISS · International Space Station\n${issPos.lat.toFixed(2)}°, ${issPos.lng.toFixed(2)}° · ${issPos.alt.toFixed(0)} km`);
      } else {
        issG.style('display', 'none');
      }
    } else {
      this.trailsG.select('g.iss-trail-g').remove();
      this.satellitesG.select('g.iss-marker-g').remove();
    }

    // === SATELITY ===
    if (cfg.satellites) {
      const sats = this.satellites;
      const sel = this.satellitesG.selectAll('g.cosmos-sat-g').data(sats, d => d.label);
      sel.exit().remove();
      const enter = sel.enter().append('g').attr('class', 'cosmos-sat-g').style('cursor', 'pointer');
      enter.append('circle').attr('class', d => 'cosmos-sat cosmos-sat-' + d.type).attr('r', 2.5);
      enter.append('title');
      enter.on('click', function(event, d) {
        event.stopPropagation();
        const altKm = d.alt < 10000 ? d.alt.toFixed(0) + ' km (LEO)' :
                       d.alt < 30000 ? d.alt.toFixed(0) + ' km (MEO)' :
                       d.alt.toFixed(0) + ' km (GEO)';
        showToast(`📡 ${d.label} · ${altKm}`, 3500);
      });
      // Aktualizuj pozycje
      const merged = sel.merge(enter);
      merged.each((d, i, nodes) => {
        const node = d3.select(nodes[i]);
        const pos = this.satellitePosition(d, tNow);
        const screen = this.projectSatellite(pos);
        if (screen) {
          node.style('display', null).attr('transform', `translate(${screen[0]},${screen[1]})`);
          node.select('title').text(`${d.label}\n${pos.lat.toFixed(1)}°, ${pos.lng.toFixed(1)}° · ${pos.alt.toFixed(0)} km`);
        } else {
          node.style('display', 'none');
        }
      });
    } else {
      this.satellitesG.selectAll('g.cosmos-sat-g').remove();
    }

    // === ŚMIECI ===
    if (cfg.debris) {
      const items = this.debris;
      const sel = this.debrisG.selectAll('g.cosmos-debris-g').data(items, d => d.label);
      sel.exit().remove();
      const enter = sel.enter().append('g').attr('class', 'cosmos-debris-g').style('cursor', 'pointer');
      enter.append('text').attr('class', 'cosmos-debris').text(d => d.emoji);
      enter.append('title');
      enter.on('click', function(event, d) {
        event.stopPropagation();
        showToast(`${d.emoji} ${d.label}`, 4000);
      });
      const merged = sel.merge(enter);
      merged.each((d, i, nodes) => {
        const node = d3.select(nodes[i]);
        // Roadster Elona - bardzo daleko, pomijamy w widoku Ziemi
        if (d.alt > 100000) { node.style('display', 'none'); return; }
        const pos = this.satellitePosition(d, tNow);
        const screen = this.projectSatellite(pos);
        if (screen) {
          d.spin += d.spinSpeed * 0.016;
          node.style('display', null).attr('transform', `translate(${screen[0]},${screen[1]}) rotate(${d.spin})`);
          node.select('title').text(`${d.label}\n${pos.lat.toFixed(1)}°, ${pos.lng.toFixed(1)}° · ${pos.alt.toFixed(0)} km`);
        } else {
          node.style('display', 'none');
        }
      });
    } else {
      this.debrisG.selectAll('g.cosmos-debris-g').remove();
    }

    // === KOMETY ===
    if (cfg.comets) {
      const comets = this.comets;
      const sel = this.cometsG.selectAll('g.cosmos-comet-g').data(comets, (d, i) => i);
      sel.exit().remove();
      const enter = sel.enter().append('g').attr('class', 'cosmos-comet-g');
      enter.append('path').attr('class', 'cosmos-comet-tail');
      enter.append('circle').attr('class', 'cosmos-comet-head').attr('r', 3);
      const merged = sel.merge(enter);
      merged.each((d, i, nodes) => {
        const node = d3.select(nodes[i]);
        const t = d.age / d.lifetime; // 0..1
        const x = d.start[0] + (d.end[0] - d.start[0]) * t;
        const y = d.start[1] + (d.end[1] - d.start[1]) * t;
        // Warkocz: za kometą, w stronę od której przyleciała (przeciwna do ruchu)
        const dx = d.end[0] - d.start[0];
        const dy = d.end[1] - d.start[1];
        const len = Math.hypot(dx, dy);
        const ux = -dx / len, uy = -dy / len;
        const tailLen = 80 + 40 * Math.sin(t * Math.PI);
        const tx = x + ux * tailLen;
        const ty = y + uy * tailLen;
        const fadeAlpha = Math.sin(t * Math.PI); // wzrasta i opada
        node.attr('opacity', fadeAlpha);
        node.select('path').attr('d', `M ${x} ${y} L ${tx} ${ty}`);
        node.select('circle').attr('cx', x).attr('cy', y);
      });
    } else {
      this.cometsG.selectAll('g.cosmos-comet-g').remove();
    }
  },

  // Włącz tryb kosmosu - wstawia do globusa, startuje animację
  enable() {
    if (state.view !== 'globe') return;
    if (!this.initialized) this.init();
    // Pokaz informację
    this.startAnimation();
  },

  disable() {
    this.stopAnimation();
    if (this.orbitsG) this.orbitsG.selectAll('*').remove();
    if (this.trailsG) this.trailsG.selectAll('*').remove();
    if (this.satellitesG) this.satellitesG.selectAll('*').remove();
    if (this.debrisG) this.debrisG.selectAll('*').remove();
    if (this.cometsG) this.cometsG.selectAll('*').remove();
  },

  // Re-render bez animacji (np. po obrocie globusa)
  redraw() {
    if (!state.cosmos.on) return;
    const tNow = (Date.now() - this.t0) / 1000;
    this.draw(tNow);
  }
};

// Wariant isVisibleOnGlobe z marginesem (dla satelitów które są wyżej)
function isVisibleOnGlobeWithMargin(lat, lng, rotate, marginDeg) {
  const lambda = -rotate[0] * Math.PI / 180;
  const phi = -rotate[1] * Math.PI / 180;
  const lat2 = lat * Math.PI / 180;
  const lng2 = lng * Math.PI / 180;
  const cosc = Math.sin(phi) * Math.sin(lat2) + Math.cos(phi) * Math.cos(lat2) * Math.cos(lng2 - lambda);
  // marginDeg pozwala satelicie być widzianym nawet jeśli jest "za" horyzontem,
  // ale wystaje wystarczająco wysoko nad nim
  const threshold = -Math.sin(marginDeg * Math.PI / 180);
  return cosc > threshold;
}

function pinchDist(touches) {
  return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
}

/* ============================================================
   ASTRONOMIA - pozycje słońca i księżyca (subsolar / sublunar point)
   Bazuje na uproszczonych formułach (Astronomical Algorithms - Meeus, low-precision)
   Dokładność ~0.5-1° wystarczająca do wizualizacji.
   ============================================================ */

// Day of year (1-366)
function dayOfYear(d) {
  const start = new Date(Date.UTC(d.getUTCFullYear(), 0, 0));
  const diff = d - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

// Pozycja Słońca: subsolar point (lat = deklinacja, lng = -GHA)
function computeSunPosition(date) {
  const d = date || new Date();
  // Julian Day
  const jd = d.getTime() / 86400000 + 2440587.5;
  const n = jd - 2451545.0; // dni od J2000.0

  // Mean longitude of Sun (degrees)
  let L = (280.460 + 0.9856474 * n) % 360;
  if (L < 0) L += 360;
  // Mean anomaly
  let g = ((357.528 + 0.9856003 * n) % 360) * Math.PI / 180;
  // Ecliptic longitude
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * Math.PI / 180;
  // Obliquity of ecliptic
  const eps = (23.439 - 0.0000004 * n) * Math.PI / 180;
  // Declination
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda)) * 180 / Math.PI;
  // Right ascension
  let ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)) * 180 / Math.PI;
  if (ra < 0) ra += 360;

  // Greenwich Mean Sidereal Time (degrees)
  const T = n / 36525;
  let gmst = (280.46061837 + 360.98564736629 * n + 0.000387933 * T * T) % 360;
  if (gmst < 0) gmst += 360;

  // Subsolar longitude = ra - gmst (mod 360, then to -180..180)
  let lng = ra - gmst;
  while (lng > 180) lng -= 360;
  while (lng < -180) lng += 360;

  return { lat: dec, lng: lng };
}

// Pozycja Księżyca: sublunar point + faza
function computeMoonPosition(date) {
  const d = date || new Date();
  const jd = d.getTime() / 86400000 + 2440587.5;
  const n = jd - 2451545.0;
  const T = n / 36525;

  // Uproszczone (low-precision) elementy orbity Księżyca - Meeus chapter 47
  const D2R = Math.PI / 180;
  // Średnia długość Księżyca
  let L = (218.316 + 13.176396 * n) % 360;
  // Średnia anomalia Księżyca
  let M = (134.963 + 13.064993 * n) % 360;
  // Argument szerokości
  let F = (93.272 + 13.229350 * n) % 360;
  // Średnia anomalia Słońca (do fazy)
  let Ms = (357.528 + 0.9856003 * n) % 360;

  L *= D2R; M *= D2R; F *= D2R; Ms *= D2R;

  // Długość ekliptyczna Księżyca
  const lambda = (L * 180/Math.PI + 6.289 * Math.sin(M)) * D2R;
  // Szerokość ekliptyczna
  const beta = (5.128 * Math.sin(F)) * D2R;
  // Obliquity
  const eps = (23.439 - 0.0000004 * n) * D2R;

  // Konwersja ekliptyka -> ekwator
  const sinDec = Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lambda);
  const dec = Math.asin(sinDec) * 180/Math.PI;
  const ra = Math.atan2(
    Math.sin(lambda) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps),
    Math.cos(lambda)
  ) * 180/Math.PI;
  const raNorm = (ra + 360) % 360;

  // GMST
  let gmst = (280.46061837 + 360.98564736629 * n + 0.000387933 * T * T) % 360;
  if (gmst < 0) gmst += 360;

  let lng = raNorm - gmst;
  while (lng > 180) lng -= 360;
  while (lng < -180) lng += 360;

  // Faza księżyca: kąt elongacji od Słońca
  // synodic age - przybliżenie: phase 0..1 gdzie 0=nów, 0.5=pełnia
  // Użyj uproszczonej formuły bazowanej na Julian day od ostatniego znanego nowiu
  // Nowy Księżyc 2000-01-06 18:14 UTC, JD = 2451550.1
  const knownNewMoon = 2451550.1;
  const synodic = 29.530588853;
  let phase = ((jd - knownNewMoon) / synodic) % 1;
  if (phase < 0) phase += 1;

  return { lat: dec, lng: lng, phase: phase };
}

function describeMoonPhase(p) {
  if (p < 0.03 || p > 0.97) return 'Nów';
  if (p < 0.22) return 'Sierp przybywający';
  if (p < 0.28) return 'Pierwsza kwadra';
  if (p < 0.47) return 'Garbaty przybywający';
  if (p < 0.53) return 'Pełnia';
  if (p < 0.72) return 'Garbaty ubywający';
  if (p < 0.78) return 'Ostatnia kwadra';
  return 'Sierp ubywający';
}

// Czy punkt (lat,lng) jest widoczny na orthographic projection przy danej rotacji
function isVisibleOnGlobe(lat, lng, rotate) {
  const lambda = -rotate[0] * Math.PI / 180;
  const phi = -rotate[1] * Math.PI / 180;
  const lat2 = lat * Math.PI / 180;
  const lng2 = lng * Math.PI / 180;
  const cosc = Math.sin(phi) * Math.sin(lat2) + Math.cos(phi) * Math.cos(lat2) * Math.cos(lng2 - lambda);
  return cosc > 0;
}

function highlightGlobeMarker(uuid) {
  if (!globe.initialized) return;
  globe.markersG.selectAll('g.globe-marker-g').each(function(d) {
    d3.select(this).select('circle.globe-marker').classed('active', d && d.uuid === uuid);
  });
}

/* ============================================================
   STARFIELD (canvas tło dla globusa - tylko dark mode)
   ============================================================ */
let starfieldInited = false;
function initStarfield() {
  if (starfieldInited) return;
  starfieldInited = true;
  const canvas = $('globeStars');
  const ctx = canvas.getContext('2d');
  const stars = [];
  const meteors = []; // {x, y, vx, vy, length, life, maxLife}
  function setSize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars.length = 0;
    const n = Math.round((canvas.width * canvas.height) / 7000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random() * 0.8 + 0.2,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }
  function spawnMeteor() {
    // Meteor leci pod kątem ~30° z prawego górnego rogu w dół-lewo (tradycyjnie)
    const startX = Math.random() * canvas.width * 0.7 + canvas.width * 0.3;
    const startY = -20;
    const speed = 6 + Math.random() * 6;
    const angle = (Math.PI * 0.6) + (Math.random() - 0.5) * 0.6; // ~108° ± 17°
    meteors.push({
      x: startX, y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      length: 80 + Math.random() * 80,
      life: 0,
      maxLife: 60 + Math.random() * 30,
      brightness: 0.7 + Math.random() * 0.3
    });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const t = Date.now() / 1000;
    // gwiazdy
    for (const s of stars) {
      const alpha = s.a * (0.6 + 0.4 * Math.sin(t + s.twinkle));
      ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    // meteory - tylko gdy włączone i jesteśmy w trybie globusa
    if (state.cosmos && state.cosmos.on && state.cosmos.meteors && state.view === 'globe') {
      // nowe co 1-3 sekundy średnio
      if (Math.random() < 0.012) spawnMeteor();
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        m.life++;
        const fadeIn = Math.min(1, m.life / 8);
        const fadeOut = Math.max(0, 1 - (m.life - m.maxLife + 15) / 15);
        const alpha = m.brightness * fadeIn * fadeOut;
        // smuga - gradient od jasnego do przezroczystego
        const tailX = m.x - m.vx * (m.length / Math.hypot(m.vx, m.vy));
        const tailY = m.y - m.vy * (m.length / Math.hypot(m.vx, m.vy));
        const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, `rgba(255, 255, 240, ${alpha})`);
        grad.addColorStop(0.4, `rgba(180, 220, 255, ${alpha * 0.5})`);
        grad.addColorStop(1, 'rgba(180, 220, 255, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        // główka
        ctx.fillStyle = `rgba(255, 255, 240, ${alpha})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
        if (m.life > m.maxLife || m.x < -50 || m.x > canvas.width + 50 || m.y > canvas.height + 50) {
          meteors.splice(i, 1);
        }
      }
    } else {
      meteors.length = 0;
    }
    requestAnimationFrame(draw);
  }
  setSize();
  window.addEventListener('resize', setSize);
  draw();
}

/* ============================================================
   INIT
   ============================================================ */
async function main() {
  // Zastosuj zapisane preferencje PRZED initMap (theme wpływa na tile layer)
  applyTheme(state.theme);

  initMap();
  map.on('click', closeAllPanels);

  tryGeolocation();
  setLoadingStatus('Łączenie z radio-browser.info…');

  const stations = await loadStations();
  state.stations = stations;
  state.byUuid = new Map(stations.map(s => [s.uuid, s]));
  $('stationCount').textContent = stations.length.toString();

  setLoadingStatus('Renderowanie mapy…');
  renderMarkers();
  updateFavBadge();

  // Zastosuj zapisany widok (mapa/globus) PO załadowaniu stacji
  applyView(state.view);

  // Stan trybu kosmicznego z localStorage
  if (state.cosmos.on) {
    $('cosmosBtn').classList.add('active');
    // applyView już mogło wywołać cosmos.enable() jeśli view === 'globe'
  }

  // małe opóźnienie aby splash wyglądał płynnie
  setTimeout(hideLoading, 400);

  if (stations.length === 0) {
    showToast('Brak połączenia. Sprawdź internet.');
  }
}
